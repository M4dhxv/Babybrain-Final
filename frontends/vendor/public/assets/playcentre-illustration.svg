<svg viewBox="0 0 420 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an indoor play centre with children playing in a circle">
  <defs>
    <clipPath id="pc-glass"><rect x="94" y="204" width="108" height="92" rx="7"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="360" rx="182" ry="20" fill="#EFE1D4"/>

  <!-- clouds -->
  <g stroke="#BFE0EF" stroke-width="3" stroke-linejoin="round">
    <path d="M78 58c0-9 8-15 16-13 3-9 17-10 22-2 10-2 18 5 17 13z" fill="#ffffff"/>
    <path d="M302 44c0-8 7-13 14-11 3-8 15-9 19-2 9-1 15 5 14 12z" fill="#ffffff"/>
  </g>

  <!-- tree, right -->
  <g stroke="#4A3A32" stroke-width="4" stroke-linejoin="round">
    <rect x="360" y="250" width="14" height="74" rx="6" fill="#B07C4A"/>
    <circle cx="356" cy="234" r="25" fill="#86C053"/>
    <circle cx="380" cy="242" r="21" fill="#78B84B"/>
    <circle cx="372" cy="216" r="21" fill="#9AD16A"/>
  </g>

  <!-- roof -->
  <g stroke="#4A3A32" stroke-width="4" stroke-linejoin="round">
    <rect x="56" y="102" width="256" height="30" rx="10" fill="#EF9A6B"/>
    <g fill="#E8734A">
      <path d="M56 132a18 14 0 0 0 36 0z"/><path d="M92 132a18 14 0 0 0 36 0z"/>
      <path d="M128 132a18 14 0 0 0 36 0z"/><path d="M164 132a18 14 0 0 0 36 0z"/>
      <path d="M200 132a18 14 0 0 0 36 0z"/><path d="M236 132a18 14 0 0 0 36 0z"/>
      <path d="M272 132a18 14 0 0 0 36 0z"/>
    </g>
  </g>

  <!-- sign board -->
  <rect x="128" y="72" width="160" height="44" rx="10" fill="#FFF7EC" stroke="#4A3A32" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#4A3A32"><circle cx="137" cy="81" r="2.4"/><circle cx="279" cy="81" r="2.4"/><circle cx="137" cy="107" r="2.4"/><circle cx="279" cy="107" r="2.4"/></g>
  <path d="M150 90c2-4 8-4 8 1 0 4-8 9-8 9s-8-5-8-9c0-5 6-5 8-1z" fill="#F26B6B" stroke="#4A3A32" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="218" y="105" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="27" font-weight="700" fill="#F2589B" letter-spacing="2">PLAY</text>

  <!-- building body -->
  <rect x="70" y="116" width="230" height="220" rx="14" fill="#FFF1E7" stroke="#4A3A32" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#FBD8C6">
    <rect x="76" y="304" width="26" height="14" rx="4"/><rect x="266" y="304" width="26" height="14" rx="4"/>
  </g>

  <!-- awning -->
  <g stroke="#4A3A32" stroke-width="4" stroke-linejoin="round">
    <rect x="62" y="144" width="246" height="24" rx="5" fill="#ffffff"/>
    <g stroke="none">
      <rect x="62" y="146" width="41" height="20" fill="#F26B6B"/>
      <rect x="144" y="146" width="41" height="20" fill="#F26B6B"/>
      <rect x="226" y="146" width="41" height="20" fill="#F26B6B"/>
    </g>
    <rect x="62" y="144" width="246" height="24" rx="5" fill="none"/>
    <path d="M62 168a20.5 17 0 0 0 41 0z" fill="#F26B6B"/><path d="M103 168a20.5 17 0 0 0 41 0z" fill="#ffffff"/>
    <path d="M144 168a20.5 17 0 0 0 41 0z" fill="#F26B6B"/><path d="M185 168a20.5 17 0 0 0 41 0z" fill="#ffffff"/>
    <path d="M226 168a20.5 17 0 0 0 41 0z" fill="#F26B6B"/><path d="M267 168a20.5 17 0 0 0 41 0z" fill="#ffffff"/>
  </g>

  <!-- window with indoor play equipment: slide + ball pit -->
  <rect x="90" y="200" width="116" height="100" rx="9" fill="#CDEBF8" stroke="#4A3A32" stroke-width="4" stroke-linejoin="round"/>
  <g clip-path="url(#pc-glass)">
    <path d="M96 206l40 -8 -60 40z" fill="#ffffff" opacity="0.4"/>
    <path d="M150 204l24 -6 -44 30z" fill="#ffffff" opacity="0.3"/>
    <rect x="164" y="250" width="20" height="20" rx="5" fill="#5AB1E4" stroke="#4A3A32" stroke-width="2.5"/>
    <path d="M108 288V252c0-8 8-12 16-12h14v12h-12c-6 0-8 4-8 10v26z" fill="#FFD34D" stroke="#4A3A32" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#4A3A32" stroke-width="2.5"><line x1="140" y1="240" x2="140" y2="290"/><line x1="152" y1="240" x2="152" y2="290"/><line x1="140" y1="252" x2="152" y2="252"/><line x1="140" y1="266" x2="152" y2="266"/><line x1="140" y1="280" x2="152" y2="280"/></g>
    <g stroke="#4A3A32" stroke-width="2.5">
      <circle cx="126" cy="290" r="6" fill="#F26B6B"/><circle cx="140" cy="292" r="6" fill="#97C459"/>
      <circle cx="154" cy="290" r="6" fill="#B98CD9"/><circle cx="168" cy="292" r="6" fill="#FF9E5C"/>
    </g>
  </g>

  <!-- door + OPEN sign -->
  <rect x="224" y="298" width="76" height="12" rx="4" fill="#E9C79B" stroke="#4A3A32" stroke-width="4" stroke-linejoin="round"/>
  <rect x="228" y="196" width="66" height="104" rx="8" fill="#CE924E" stroke="#4A3A32" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#B67B3C" stroke-width="3"><line x1="250" y1="202" x2="250" y2="294"/><line x1="272" y1="202" x2="272" y2="294"/></g>
  <circle cx="285" cy="250" r="4" fill="#7A4E27"/>
  <line x1="261" y1="196" x2="261" y2="208" stroke="#4A3A32" stroke-width="2.5"/>
  <rect x="244" y="208" width="36" height="18" rx="4" fill="#ffffff" stroke="#4A3A32" stroke-width="2.5"/>
  <text x="262" y="221" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="9" font-weight="700" fill="#4A3A32">OPEN</text>

  <!-- potted plant by the door -->
  <g stroke="#4A3A32" stroke-width="3" stroke-linejoin="round">
    <path d="M302 298c8 0 16 0 16 0l-3 22c0 3-4 4-10 4s-10-1-10-4z" fill="#E8905A"/>
    <path d="M310 298c-2-12 6-18 6-18s2 10-2 18z" fill="#7FBF4B"/>
    <path d="M310 298c2-10-6-16-6-16s-2 8 2 16z" fill="#9AD16A"/>
  </g>

  <!-- children playing in a circle, foreground -->
  <g stroke="#4A3A32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- joined-hands arms between kids -->
    <path d="M79 332q22 14 44 18" fill="none"/>
    <path d="M137 350q36 10 72 0" fill="none"/>
    <path d="M209 350q36 10 72 0" fill="none"/>
    <path d="M281 350q22 -4 44 -18" fill="none"/>
    <path d="M63 356q4 -18 16 -24" fill="none"/>
    <path d="M341 356q-4 -18 -16 -24" fill="none"/>

    <!-- kid 1 -->
    <g>
      <line x1="92" y1="356" x2="90" y2="338"/><line x1="100" y1="356" x2="102" y2="338"/>
      <rect x="87" y="322" width="18" height="18" rx="7" fill="#F26B6B"/>
      <circle cx="96" cy="312" r="8" fill="#F1C27D"/>
      <path d="M88 312a8 8 0 0 1 16 0z" fill="#3A2A20"/>
      <circle cx="93.5" cy="313" r="1.1" fill="#4A3A32" stroke="none"/><circle cx="98.5" cy="313" r="1.1" fill="#4A3A32" stroke="none"/>
    </g>
    <!-- kid 2 -->
    <g>
      <line x1="146" y1="366" x2="144" y2="346"/><line x1="154" y1="366" x2="156" y2="346"/>
      <rect x="141" y="330" width="18" height="18" rx="7" fill="#FFD34D"/>
      <circle cx="150" cy="320" r="8" fill="#8D5524"/>
      <path d="M142 320a8 8 0 0 1 16 0z" fill="#1F1712"/>
      <circle cx="158" cy="316" r="3" fill="#1F1712"/>
      <circle cx="147.5" cy="321" r="1.1" fill="#F5E6D6" stroke="none"/><circle cx="152.5" cy="321" r="1.1" fill="#F5E6D6" stroke="none"/>
    </g>
    <!-- kid 3 -->
    <g>
      <line x1="206" y1="370" x2="204" y2="350"/><line x1="214" y1="370" x2="216" y2="350"/>
      <rect x="201" y="334" width="18" height="18" rx="7" fill="#5AB1E4"/>
      <circle cx="210" cy="324" r="8" fill="#FFDBAC"/>
      <path d="M202 324a8 8 0 0 1 16 0z" fill="#6B4226"/>
      <circle cx="207.5" cy="325" r="1.1" fill="#4A3A32" stroke="none"/><circle cx="212.5" cy="325" r="1.1" fill="#4A3A32" stroke="none"/>
    </g>
    <!-- kid 4 -->
    <g>
      <line x1="266" y1="366" x2="264" y2="346"/><line x1="274" y1="366" x2="276" y2="346"/>
      <rect x="261" y="330" width="18" height="18" rx="7" fill="#97C459"/>
      <circle cx="270" cy="320" r="8" fill="#C68642"/>
      <path d="M262 320a8 8 0 0 1 16 0z" fill="#2A2A2A"/>
      <circle cx="267.5" cy="321" r="1.1" fill="#F5E6D6" stroke="none"/><circle cx="272.5" cy="321" r="1.1" fill="#F5E6D6" stroke="none"/>
    </g>
    <!-- kid 5 -->
    <g>
      <line x1="322" y1="356" x2="320" y2="338"/><line x1="330" y1="356" x2="332" y2="338"/>
      <rect x="317" y="322" width="18" height="18" rx="7" fill="#B98CD9"/>
      <circle cx="326" cy="312" r="8" fill="#F1C27D"/>
      <path d="M318 312a8 8 0 0 1 16 0z" fill="#4A2E1F"/>
      <circle cx="317" cy="316" r="3" fill="#4A2E1F"/><circle cx="335" cy="316" r="3" fill="#4A2E1F"/>
      <circle cx="323.5" cy="313" r="1.1" fill="#4A3A32" stroke="none"/><circle cx="328.5" cy="313" r="1.1" fill="#4A3A32" stroke="none"/>
    </g>
  </g>
</svg>
