<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/app/assets/brand/logo-icon.png" />
    <meta
      name="description"
      content="BabyBrain.sg — find and book the best kids' activities and classes in Singapore."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the Supabase connection (DNS + TLS + HTTP/2) while the bundle is
         still downloading, so the first getSession / query / RPC doesn't pay
         ~400-800 ms of cold connection setup. Same host serves the storage
         images. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="https://static.wixstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>BabyBrain.sg</title>

    <!-- Home-screen identity. Without a manifest, "Add to Home screen" ignores
         the favicon (it is 385x256, not square) and draws a grey letter tile
         instead. The icons below are square crops of the same brand mark. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app/assets/brand/apple-touch-icon.png" />
    <!-- #FA4D8D — a solid bright-pink OS status bar / PWA chrome in the
         installed app, sitting as a hard block above the cream header. -->
    <meta name="theme-color" content="#FA4D8D" />
    <script>
      /* That pink theme-color is only wanted in the installed app. In a plain
         browser tab it just paints a bar over a cream page, so swap it to the
         page colour there. Runs synchronously in <head> so the bar is right
         on first paint. */
      (function () {
        try {
          var app =
            matchMedia("(display-mode: standalone)").matches ||
            matchMedia("(display-mode: minimal-ui)").matches ||
            matchMedia("(display-mode: fullscreen)").matches ||
            window.navigator.standalone === true;
          if (!app) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#FFFCF8");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="BabyBrain" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Boot splash: inline CSS so it paints before any bundle loads. A stale
         or half-restored tab (browser restart, dev-server restart) can keep a
         dead module graph and never mount React — this replaces the old blank
         "Loading..." with the brand loader, and the script below keeps
         reloading the tab until it actually boots and shows content. React
         clears #root's children on first render, which removes the splash. -->
    <style>
      /* Instant, before any stylesheet loads: closes the exact gap QA hit —
         React's first render clears #bb-boot from #root (see the comment
         above), and if that commit then fails partway (a crash, or the app
         getting killed and cold-relaunched by Android while the screen was
         off) there is a window before the watchdog's next check where
         html/body have no explicit background of their own yet (this same
         cream is set again in styles/index.css, but that's inside the JS/CSS
         bundle, not guaranteed loaded yet). Without this, that window shows
         the browser/WebView default — black in a dark-mode Android context —
         which reads as a crashed app rather than one still loading. */
      html, body { background: #fffcf8; color-scheme: light; }
      #bb-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fffcf8;
        font-family: Nunito, ui-sans-serif, system-ui, sans-serif;
      }
      /* Boot splash: the ring of dots and the icon pop in together inside
         ~350ms, then settle into a continuous idle animation — the ring
         orbits the icon, the icon itself gives a gentle breathing bob. This
         used to be a leisurely staged reveal (dots, then icon at 1.7s, then
         name at 2.2s) — but React clears this the moment it mounts (see the
         comment above), and a fast load (esp. with the SW app-shell cache)
         can unmount it well before a multi-second sequence ever reaches the
         icon/name payoff, so most launches only ever showed scattering dots
         or nothing at all. Resolving to the full branded state almost
         immediately means whatever sliver of time this is on screen, it's
         already the finished look — the idle motion after that is just a
         "still working" signal for however long the real boot takes. */
      #bb-boot .bb-scene {
        position: relative;
        width: 116px;
        height: 116px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* One rotating ring holds all five dots, so the whole formation orbits
         the icon as a unit — each dot only needs its own fixed angle
         (inline transform below) and color; the ring's own animation adds
         the continuous spin on top. */
      #bb-boot .bb-orbit {
        position: absolute;
        inset: 0;
        animation: bb-orbit-spin 5s linear infinite;
      }
      #bb-boot .bb-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
      }
      /* The logo is inlined (data URI) and never starts transparent: it is
         on screen from the very first frame, so a fast hand-off to React's
         identical BootSplash can't land on an invisible logo. object-contain
         with no radius/overflow — the artwork is padded inside its canvas, so
         nothing is cropped at the sides. */
      #bb-boot .bb-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
        position: relative;
        z-index: 1;
        animation: bb-icon-bob 2.4s ease-in-out infinite;
      }
      #bb-boot .bb-name {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      /* "BabyBrain" in the logo's rainbow — a left-to-right sweep through the
         six brand pastels, matching the confetti dots above. */
      #bb-boot .bb-name i { font-style: normal; }
      #bb-boot .bb-name i:nth-child(1) { color: #ffc1d6; }
      #bb-boot .bb-name i:nth-child(2) { color: #ffc1d6; }
      #bb-boot .bb-name i:nth-child(3) { color: #ffb77a; }
      #bb-boot .bb-name i:nth-child(4) { color: #ffd77a; }
      #bb-boot .bb-name i:nth-child(5) { color: #a8e59a; }
      #bb-boot .bb-name i:nth-child(6) { color: #a7d8f8; }
      #bb-boot .bb-name i:nth-child(7) { color: #a7d8f8; }
      #bb-boot .bb-name i:nth-child(8) { color: #c7b1e6; }
      #bb-boot .bb-name i:nth-child(9) { color: #c7b1e6; }
      #bb-boot .bb-name span { font-weight: 600; color: #7b7278; }
      #bb-boot .bb-retry {
        display: none;
        border: 0;
        border-radius: 10px;
        background: #fa4d8d;
        color: #fff;
        font: inherit;
        font-weight: 800;
        padding: 10px 18px;
        cursor: pointer;
      }
      /* Freeze on the fully-resolved frame — ring, icon and name all
         visible and settled — rather than mid-pop-in or mid-orbit. The ring
         itself just pauses wherever its rotation happens to be; only the
         icon's bob needs its transform reset, since a paused mid-bob frame
         would otherwise freeze it visibly off-center. */
      #bb-boot.bb-stuck .bb-orbit,
      #bb-boot.bb-stuck .bb-icon { animation-play-state: paused; }
      #bb-boot.bb-stuck .bb-icon { transform: none; }
      #bb-boot.bb-stuck .bb-retry { display: inline-block; }
      #bb-boot.bb-stuck .bb-hint { display: block; }
      #bb-boot .bb-hint { display: none; }
      @keyframes bb-orbit-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes bb-icon-bob {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        #bb-boot .bb-orbit, #bb-boot .bb-icon { animation: none; }
      }
    </style>
    <script>
      /* Self-heal a stale tab so it never just sits there looking idle.
       *
       * Two failure modes after a browser or dev/deploy server restart:
       *   1. The restored tab keeps a dead module graph — the entry script
       *      never runs, React never mounts, nothing shows but this splash.
       *   2. React DOES mount but then wedges on an in-app loading gate (a
       *      hung auth/network call), showing "Loading…" forever.
       * Both used to need a manual hard refresh. We reload the tab ourselves.
       *
       * Signals set by the app:
       *   window.__BB_BOOT_JS__      entry module started running (main.tsx).
       *                              Rules out a stale asset, so we stop
       *                              reloading for mode 1.
       *   window.__BB_BOOTED__       React finished its first render (main.tsx).
       *   [data-bb-loading] in DOM   a top-level loading gate is on screen
       *                              (the auth gate / the page shells).
       */
      (function () {
        var CNT = "bb-boot-tries";
        var GATE = "bb-gate-retry";
        var SOFT = 3;    // after this many tries, also reveal the manual Reload button
        var SLOW = 6;    // after this many tries, back off to a slow retry
        var ABORT = 40;  // after this many tries, give up (~20 min of a dead server)
        var mem = 0;     // fallback count when sessionStorage is unavailable
        var pending = false;

        function jsRan()  { return window.__BB_BOOT_JS__ === true; }
        function booted() { return window.__BB_BOOTED__ === true; }
        function stillLoading() { return !!document.querySelector("[data-bb-loading]"); }
        function n() {
          try { var v = sessionStorage.getItem(CNT); return v == null ? mem : (+v || 0); }
          catch (e) { return mem; }
        }
        function setN(v) { mem = v; try { sessionStorage.setItem(CNT, v); } catch (e) {} }
        function reset() {
          mem = 0;
          try { sessionStorage.removeItem(CNT); } catch (e) {}
          try { sessionStorage.removeItem(GATE); } catch (e) {}
        }
        function markStuck() {
          var b = document.getElementById("bb-boot");
          if (b) b.classList.add("bb-stuck");
        }

        function heal() {
          if (booted()) { if (!stillLoading()) reset(); return; }
          // Bundle executed but never rendered — a code fault, not a stale
          // asset. Reloading would only loop, so surface it instead.
          if (jsRan()) { markStuck(); return; }
          if (pending) return;
          var tries = n();
          if (tries >= SOFT) markStuck();   // show the button, but keep trying
          if (tries >= ABORT) return;       // something is genuinely broken
          setN(tries + 1);
          pending = true;
          // Back off fast for the first few tries, then settle into a slow
          // retry so the tab still recovers once the server is back, without
          // hammering it.
          var delay = tries < SLOW ? Math.min(tries * 1500, 6000) : 30000;
          setTimeout(function () {
            if (!booted()) location.reload();
            else { pending = false; if (!stillLoading()) reset(); }
          }, delay);
        }

        // Mode 2: booted, but still wedged on a top-level loading gate. The
        // gate must have been on screen, with the page VISIBLE, for 20s
        // straight. Measuring from page load (performance.now) reloaded a tab
        // the moment it was foregrounded after a long time in the background
        // if any Suspense fallback happened to be showing — a reload fired
        // while the WebView was still waking, which is what read as a freeze
        // to black. Time spent hidden never counts.
        var gateSince = 0;
        function healGate() {
          var done = 0;
          try { done = +sessionStorage.getItem(GATE) || 0; } catch (e) {}
          if (done >= 1) { markStuck(); return; }
          try { sessionStorage.setItem(GATE, 1); } catch (e) {}
          location.reload();
        }
        function watchGate() {
          if (document.visibilityState !== "visible" || !booted() || !stillLoading()) { gateSince = 0; return; }
          if (!gateSince) { gateSince = Date.now(); return; }
          if (Date.now() - gateSince > 20000) { gateSince = 0; healGate(); }
        }
        setInterval(watchGate, 2000);
        document.addEventListener("visibilitychange", function () { gateSince = 0; });

        // Clear the counter once the tab has been happily booted for a moment,
        // so a later stall starts counting from zero.
        window.addEventListener("load", function () {
          setTimeout(function () { if (booted() && !stillLoading()) reset(); }, 2500);
        });
        // Browser restored the tab from bfcache — cheap and safe to reload.
        window.addEventListener("pageshow", function (e) {
          if (e.persisted && !booted()) location.reload();
        });
        // A lazily-restored tab that only really loads when it's looked at.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && !booted() && performance.now() > 4000) heal();
        });
        // Stale hashed chunk after a redeploy (prod build).
        window.addEventListener("vite:preloadError", function (e) { e.preventDefault(); heal(); });
        // The entry <script> itself failed to download (server restart / cold start).
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT" && !booted()) heal();
        }, true);

        // Watchdog: keep rechecking so the tab recovers on its own whether it
        // never mounted (mode 1) or mounted and wedged on a gate (mode 2).
        function tick() {
          if (booted()) {
            if (!stillLoading()) { reset(); return; }
          } else {
            heal();
          }
          setTimeout(tick, 15000);
        }
        function arm() { setTimeout(tick, 7000); }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
        else arm();
      })();
    </script>
  </head>
