<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app/assets/brand/logo-icon.png" />
    <meta
      name="description"
      content="BabyBrain.sg — find and book the best kids' activities and classes in Singapore."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>BabyBrain.sg</title>

    <!-- Boot splash: inline CSS so it paints before any bundle loads. A stale
         or half-restored tab (browser restart, dev-server restart) can keep a
         dead module graph and never mount React — this replaces the old blank
         "Loading..." with the brand loader, and the script below keeps
         reloading the tab until it actually boots and shows content. React
         clears #root's children on first render, which removes the splash. -->
    <style>
      #bb-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #fffcf8;
        font-family: Nunito, ui-sans-serif, system-ui, sans-serif;
      }
      #bb-boot .bb-orbit {
        position: relative;
        width: 76px;
        height: 76px;
        animation: bb-spin 1.6s linear infinite;
      }
      #bb-boot .bb-orbit i {
        position: absolute;
        top: calc(50% - 7.5px);
        left: calc(50% - 7.5px);
        width: 15px;
        height: 15px;
        border-radius: 50%;
      }
      #bb-boot .bb-orbit i:nth-child(1) { background: #ffc1d6; transform: rotate(0deg)   translateY(-30px); animation: bb-bob 1.6s ease-in-out infinite; }
      #bb-boot .bb-orbit i:nth-child(2) { background: #ffb77a; transform: rotate(60deg)  translateY(-30px); animation: bb-bob 1.6s ease-in-out 0.13s infinite; }
      #bb-boot .bb-orbit i:nth-child(3) { background: #ffd77a; transform: rotate(120deg) translateY(-30px); animation: bb-bob 1.6s ease-in-out 0.26s infinite; }
      #bb-boot .bb-orbit i:nth-child(4) { background: #a8e59a; transform: rotate(180deg) translateY(-30px); animation: bb-bob 1.6s ease-in-out 0.39s infinite; }
      #bb-boot .bb-orbit i:nth-child(5) { background: #a7d8f8; transform: rotate(240deg) translateY(-30px); animation: bb-bob 1.6s ease-in-out 0.52s infinite; }
      #bb-boot .bb-orbit i:nth-child(6) { background: #c7b1e6; transform: rotate(300deg) translateY(-30px); animation: bb-bob 1.6s ease-in-out 0.65s infinite; }
      #bb-boot .bb-word { font-size: 15px; font-weight: 800; color: #111a4c; letter-spacing: -0.01em; }
      #bb-boot .bb-word span { font-weight: 600; color: #7b7278; }
      #bb-boot .bb-retry {
        display: none;
        border: 0;
        border-radius: 10px;
        background: #fa4d8d;
        color: #fff;
        font: inherit;
        font-weight: 800;
        padding: 10px 18px;
        cursor: pointer;
      }
      #bb-boot.bb-stuck .bb-orbit { animation-play-state: paused; opacity: 0.35; }
      #bb-boot.bb-stuck .bb-retry { display: inline-block; }
      #bb-boot.bb-stuck .bb-hint { display: block; }
      #bb-boot .bb-hint { display: none; }
      @keyframes bb-spin { to { transform: rotate(360deg); } }
      @keyframes bb-bob { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #bb-boot .bb-orbit,
        #bb-boot .bb-orbit i { animation-duration: 2.6s; }
      }
    </style>
    <script>
      /* Self-heal a stale tab so it never just sits there looking idle.
       *
       * After a browser restart or a dev/deploy server restart, a restored tab
       * often keeps a dead module graph: the entry script never executes,
       * React never mounts, and nothing shows but this splash until a manual
       * hard refresh. We reload the tab ourselves until it actually boots.
       *
       * Two signals set by the app (see main.tsx):
       *   window.__BB_BOOT_JS__  the entry module started running. Once set, a
       *                          stale/failed asset is ruled out, so reloading
       *                          can't help and we stop.
       *   window.__BB_BOOTED__   React finished its first render. Clears the
       *                          retry counter and the "stuck" state.
       */
      (function () {
        var CNT = "bb-boot-tries";
        var SOFT = 3;    // after this many tries, also reveal the manual Reload button
        var SLOW = 6;    // after this many tries, back off to a slow retry
        var ABORT = 40;  // after this many tries, give up (~20 min of a dead server)
        var mem = 0;     // fallback count when sessionStorage is unavailable
        var pending = false;

        function jsRan()  { return window.__BB_BOOT_JS__ === true; }
        function booted() { return window.__BB_BOOTED__ === true; }
        function n() {
          try { var v = sessionStorage.getItem(CNT); return v == null ? mem : (+v || 0); }
          catch (e) { return mem; }
        }
        function setN(v) { mem = v; try { sessionStorage.setItem(CNT, v); } catch (e) {} }
        function reset() { mem = 0; try { sessionStorage.removeItem(CNT); } catch (e) {} }
        function markStuck() {
          var b = document.getElementById("bb-boot");
          if (b) b.classList.add("bb-stuck");
        }

        function heal() {
          if (booted()) { reset(); return; }
          // Bundle executed but never rendered — a code fault, not a stale
          // asset. Reloading would only loop, so surface it instead.
          if (jsRan()) { markStuck(); return; }
          if (pending) return;
          var tries = n();
          if (tries >= SOFT) markStuck();   // show the button, but keep trying
          if (tries >= ABORT) return;       // something is genuinely broken
          setN(tries + 1);
          pending = true;
          // Back off fast for the first few tries, then settle into a slow
          // retry so the tab still recovers once the server is back, without
          // hammering it.
          var delay = tries < SLOW ? Math.min(tries * 1500, 6000) : 30000;
          setTimeout(function () {
            if (!booted()) location.reload();
            else { pending = false; reset(); }
          }, delay);
        }

        // Clear the counter once the tab has been happily booted for a moment,
        // so a later stall starts counting from zero.
        window.addEventListener("load", function () {
          setTimeout(function () { if (booted()) reset(); }, 2500);
        });
        // Browser restored the tab from bfcache — cheap and safe to reload.
        window.addEventListener("pageshow", function (e) {
          if (e.persisted && !booted()) location.reload();
        });
        // A lazily-restored tab that only really loads when it's looked at.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && !booted() && performance.now() > 4000) heal();
        });
        // Stale hashed chunk after a redeploy (prod build).
        window.addEventListener("vite:preloadError", function (e) { e.preventDefault(); heal(); });
        // The entry <script> itself failed to download (server restart / cold start).
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT" && !booted()) heal();
        }, true);

        // Watchdog: if nothing has mounted shortly after load, start healing
        // and keep rechecking so the tab recovers on its own once the server
        // is back.
        function tick() {
          if (booted()) { reset(); return; }
          heal();
          setTimeout(tick, 15000);
        }
        function arm() { setTimeout(tick, 7000); }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
        else arm();
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="bb-boot" role="status" aria-label="Loading BabyBrain">
        <div class="bb-orbit"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="bb-word">BabyBrain<span class="bb-hint"> &middot; still loading</span></div>
        <button type="button" class="bb-retry" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
