name: Scheduled release
on:
  schedule:
    - cron: '30 3 20 9 *'   # 09:00 IST on 20 September only
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge scheduled branch into main
        run: |
          if ! git ls-remote --exit-code --heads origin scheduled/time-picker >/dev/null; then
            echo "No scheduled branch, nothing to release."; exit 0
          fi
          git config user.name "scheduled-release"
          git config user.email "scheduled-release@users.noreply.github.com"
          git fetch origin scheduled/time-picker
          git merge --no-edit origin/scheduled/time-picker
          git push origin main
          git push origin --delete scheduled/time-picker
